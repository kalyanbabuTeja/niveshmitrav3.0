<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f2027;
      --card-bg: rgba(255, 255, 255, 0.06);
      --text-color: #fff;
      --highlight: #00ffd5;
    }

    body.light {
      --bg-color: #f4f4f4;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-color: #333;
      --highlight: #006cff;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.4s, color 0.4s;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--highlight);
    }

    h2 {
      font-size: 2.8rem;
      margin: 0;
      color: var(--highlight);
    }

    p {
      font-size: 1rem;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .toggle-theme {
      position: fixed;
      top: 20px;
      right: 30px;
      padding: 10px 20px;
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    canvas {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 20px;
    }
  </style>
</head>
<body>

<button class="toggle-theme" onclick="toggleTheme()">Toggle Theme</button>

<div class="dashboard">
  <div class="card">
    <div class="icon">🧠</div>
    <h2 id="models">0</h2>
    <p>AI Models Trained</p>
  </div>
  <div class="card">
    <div class="icon">👤</div>
    <h2 id="users">0</h2>
    <p>Active Users</p>
  </div>
  <div class="card">
    <div class="icon">⚙️</div>
    <h2 id="accuracy">0%</h2>
    <p>Model Accuracy</p>
  </div>
  <div class="card">
    <div class="icon">🌐</div>
    <h2 id="deployments">0</h2>
    <p>Deployments</p>
  </div>
</div>

<div style="max-width: 1200px; margin: auto; padding: 0 40px;">
  <canvas id="chart" height="100"></canvas>
</div>

<script>
  // Counter animation
  function animateValue(id, start, end, duration, suffix = '') {
    const obj = document.getElementById(id);
    let startTimestamp = null;
    const step = timestamp => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      obj.innerText = Math.floor(progress * (end - start) + start) + suffix;
      if (progress < 1) {
        window.requestAnimationFrame(step);
      }
    };
    window.requestAnimationFrame(step);
  }

  animateValue("models", 0, 142, 1000);
  animateValue("users", 0, 9812, 1200);
  animateValue("accuracy", 0, 98.7, 1000, '%');
  animateValue("deployments", 0, 21, 800);

  // Chart.js
  const ctx = document.getElementById('chart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
      datasets: [{
        label: 'Model Accuracy (%)',
        data: [85, 87, 89, 91, 94, 98.7],
        borderColor: '#00ffd5',
        backgroundColor: 'rgba(0,255,213,0.1)',
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            color: getComputedStyle(document.body).getPropertyValue('--text-color')
          }
        }
      },
      scales: {
        x: {
          ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-color') }
        },
        y: {
          ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-color') }
        }
      }
    }
  });

  // Theme toggle
  function toggleTheme() {
    document.body.classList.toggle('light');
    chart.options.plugins.legend.labels.color = getComputedStyle(document.body).getPropertyValue('--text-color');
    chart.options.scales.x.ticks.color = getComputedStyle(document.body).getPropertyValue('--text-color');
    chart.options.scales.y.ticks.color = getComputedStyle(document.body).getPropertyValue('--text-color');
    chart.update();
  }
</script>

</body>
</html>
